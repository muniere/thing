# air drives the dev loop: it rebuilds the single embedded binary and restarts
# thingd on any Go or frontend change, so dev runs the exact same artifact as
# prod on one port. The browser reloads itself over SSE — thingd sends a
# per-process bootID in its hello frame and the client reloads when it changes
# (see web/src/live.ts) — so no live-reload proxy is needed.
#
# `make serve` runs `air -- --port <p> [--dir <d>]`; args after `--` are appended
# to the built binary.
root = "."
tmp_dir = "tmp"

[build]
# `make bundle` rebuilds the SPA only when a web source changed, then relinks the
# binary, so a Go-only edit skips the esbuild bundle (see the Makefile). air has
# one build command and can't branch on the changed file, so the skipping lives
# in make's timestamp check rather than here.
cmd = "make bundle"
entrypoint = ["./tmp/thingd"]
# allowlist the source roots; assets.go/doc.go sit at the root so name them too.
include_dir = ["cmd", "internal", "web"]
include_file = ["assets.go", "doc.go"]
include_ext = ["go", "ts", "tsx", "css", "html", "json", "mjs"]
# both live inside watched web/; excluded so we don't loop on our own output.
exclude_dir = ["web/dist", "web/node_modules"]
exclude_regex = ["_test\\.go$"]
stop_on_error = true
delay = 300

[log]
time = true

[misc]
clean_on_exit = true
