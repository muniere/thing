# Example thing configuration.
# Copy to <config-dir>/config.yaml (or let `thing init` write a starter for you).

# Board title, shown as the header of `thing tree`.
title: thing

# Category headings for grouping epics in `thing tree` and top-level `thing ls`.
# They define the heading order; each epic belongs to at most one category (set
# with `thing add ... --category`). Epics with an empty or unknown category, and
# all orphan issues, fall under "(uncategorized)". With none configured, output
# stays flat.
categories:
  - Project
  - Personal

# Note: the web board's starting `filter` state, its color `theme`, and the
# light/dark `scheme` are not configured here. They shape a thingd board rather
# than describing the tree, so they live in projects.yaml — on the project's own
# entry, or in the top-level `defaults` block. See the README's Configuration
# section.
