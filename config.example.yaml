# Example thing configuration.
# Copy to <config-dir>/config.yaml (or let `thing init` write a starter for you).

# Board title, shown as the header of `thing tree`.
title: thing

# Category headings for grouping epics in `thing tree` and top-level `thing ls`.
# They define the heading order; each epic belongs to at most one category (set
# with `thing add ... --category`). Epics with an empty or unknown category, and
# all orphan issues, fall under "(uncategorized)". With none configured, output
# stays flat.
categories:
  - Project
  - Personal

# Filter state the web board (thingd) starts from. The keys mirror the sidebar
# facets; an omitted key means that facet is not filtered.
#
# thingd layers two files: the global config.yaml (THING_CONFIG_DIR, else
# $XDG_CONFIG_HOME/thing, default ~/.config/thing) applies to every project, and
# a project's own .thing/config.yaml overrides it key by key. Write `tag:` (an
# explicit null) to drop an inherited value instead of inheriting it. Title and
# categories are not layered — they still come from a single config.yaml.
filter:
  statuses: [todo, doing]
  # priorities: [high]
  # category: Project
  # tag: wip
  # query: api
